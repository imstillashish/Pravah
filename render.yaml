databases:
  - name: astitva-db
    databaseName: astitva_prod
    user: astitva_user
    plan: free
    region: oregon

services:
  - type: web
    name: astitva-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "sh scripts/deploy_entrypoint.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astitva-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRY_MINUTES
        value: "1440"
      - key: SHIP_AND_BUNKER_BASE_URL
        value: "https://shipandbunker.com/prices"
      - key: BDRY_DATA_SOURCE_URL
        value: "https://balticexchange.com/en/data-services/market-information.html"
      - key: WORLD_BANK_PINK_SHEET_URL
        value: "https://www.worldbank.org/en/research/commodity-markets"
      - key: RBI_FOREX_FEED_URL
        value: "https://www.rbi.org.in/scripts/ReferenceRateArchive.aspx"
      - key: WEATHER_API_BASE_URL
        value: "https://api.open-meteo.com/v1/forecast"
      - key: MODEL_REGISTRY_PATH
        value: "ml/models"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ADMIN_UPLOAD_MAX_MB
        value: "20"
      - key: SENTRY_DSN
        value: ""
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: astitva-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: astitva-backend
          property: host
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
